test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Public images served from Cloudflare (cdn.hypebusted.com) in front of the S3 bucket.
# Set the AWS secrets with bin/rails credentials:edit (aws:access_key_id, aws:secret_access_key).
amazon:
  service: CdnS3
  access_key_id: <%= Rails.application.credentials.dig(:aws, :access_key_id) %>
  secret_access_key: <%= Rails.application.credentials.dig(:aws, :secret_access_key) %>
  region: us-east-1
  bucket: cdn.hypebusted.com
  cdn_host: https://cdn.hypebusted.com
  upload:
    cache_control: "public, max-age=31536000, immutable"
