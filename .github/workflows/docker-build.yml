name: Docker build

# Builds the production image on GitHub's runners and pushes it to Docker Hub,
# tagged with the full commit SHA. Kamal uses that SHA as the image version, so
# deploy from your machine with:
#
#   bin/kamal deploy --skip-push
#
# which pulls the already-built image instead of building it locally.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: nnneerajjj/hypebusted

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: nnneerajjj
          password: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # Kamal refuses images without its service label; it adds this itself on local builds.
          labels: service=hypebusted
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
